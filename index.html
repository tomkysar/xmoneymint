<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Money Open Edition</title>
<meta name="description" content="X Money Open Edition — Closed.">
<meta property="og:title" content="X Money Open Edition">
<meta property="og:description" content="Closed.">
<meta property="og:url" content="https://xmoneymint.com">
<link rel="icon" type="image/svg+xml" href="assets/flag.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #71767b;   /* X's gray */
    --line: #2f3336;    /* X's border gray */
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  html { scrollbar-gutter: stable both-edges; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* faint atmosphere behind the flag */
  .glow {
    position: fixed;
    top: -20vh;
    left: 50%;
    transform: translateX(-50%);
    width: 120vmin;
    height: 120vmin;
    background: radial-gradient(closest-side, rgba(255,255,255,0.07), transparent 70%);
    pointer-events: none;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 61px 28px;
    width: 100%;
    max-width: 918px;
  }

  .reveal { opacity: 0; transform: translateY(14px); animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .logo img { width: 117px; height: auto; display: block; }

  main > * + * { margin-top: 61px; }

  .logo { animation-delay: .05s; }

  .brand {
    animation-delay: .15s;
    font-size: clamp(31px, 6.6vw, 43px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  .meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .closed {
    animation-delay: .25s;
    display: inline-block;
    font-size: clamp(13px, 2.8vw, 16px);
    font-weight: 700;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 11px 22px 11px 30px; /* extra left pad to balance letter-spacing */
  }

  .tweet {
    font-size: clamp(12px, 2.6vw, 14px);
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 4px;
    transition: color .2s, border-color .2s;
  }
  .tweet:hover { color: var(--fg); border-bottom-color: #536471; }

  footer {
    animation-delay: .5s;
    padding: 46px 24px 56px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <main>
    <div class="logo reveal">
      <img src="assets/flag.svg" alt="xmoneymint flag logo" width="108" height="62">
    </div>

    <h1 class="brand reveal">X Money<br>Open Edition</h1>

    <p class="closed reveal">Closed</p>

  </main>

  <footer class="reveal">
    <div class="meta">
      <a class="tweet" href="https://x.com/xmoneymint" target="_blank" rel="noopener">https://x.com/xmoneymint</a>
    </div>
  </footer>

</body>
</html>
