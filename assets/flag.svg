<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 210" width="364" height="210">
  <!-- xmoneymint flag mark - white on transparent -->
  <defs>
    <path id="star" d="M0,-1 L0.2246,-0.309 L0.951,-0.309 L0.3633,0.118 L0.5878,0.809 L0,0.382 L-0.5878,0.809 L-0.3633,0.118 L-0.951,-0.309 L-0.2246,-0.309 Z"/>
    <mask id="canton-mask">
      <rect x="0" y="0" width="146" height="120" fill="#fff"/>
      <g fill="#000">
        <use href="#star" transform="translate(29,26) scale(15)"/>
        <use href="#star" transform="translate(73,26) scale(15)"/>
        <use href="#star" transform="translate(117,26) scale(15)"/>
        <use href="#star" transform="translate(51,62) scale(15)"/>
        <use href="#star" transform="translate(95,62) scale(15)"/>
        <use href="#star" transform="translate(29,98) scale(15)"/>
        <use href="#star" transform="translate(73,98) scale(15)"/>
        <use href="#star" transform="translate(117,98) scale(15)"/>
      </g>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- canton with star cutouts -->
    <rect x="0" y="0" width="146" height="120" mask="url(#canton-mask)"/>
    <!-- top stripes (right of canton) -->
    <rect x="146" y="0" width="218" height="30"/>
    <rect x="146" y="60" width="218" height="30"/>
    <!-- full-width lower stripes -->
    <rect x="0" y="120" width="364" height="30"/>
    <rect x="0" y="180" width="364" height="30"/>
  </g>
</svg>
